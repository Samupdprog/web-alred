<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Software a medida</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#1c1c1c;--panel:#111;--line:rgba(255,255,255,.09);--text:#f4f4f4;--muted:rgba(255,255,255,.46);--soft:rgba(255,255,255,.13);--green:#52c78a}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f0f0f;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .visual{position:relative;width:min(620px,100%);height:380px;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.035),transparent 44%),var(--bg);perspective:1000px;isolation:isolate}
    .dots{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(circle,rgba(255,255,255,.16) .8px,transparent 1px);background-size:18px 18px;mask-image:radial-gradient(ellipse at center,#000,rgba(0,0,0,.75) 50%,transparent 86%);pointer-events:none}
    .stage{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
    .halo{position:absolute;left:50%;top:49%;width:310px;height:310px;transform:translate(-50%,-50%) translateZ(-25px);border-radius:50%;border:1px dashed rgba(255,255,255,.07);pointer-events:none;animation:halo 34s linear infinite}
    .halo:before{content:"";position:absolute;inset:24px;border-radius:50%;border:1px solid rgba(255,255,255,.025)}
    @keyframes halo{to{transform:translate(-50%,-50%) translateZ(-25px) rotate(360deg)}}
    .badge{position:absolute;z-index:20;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,10,.95);font-size:12px;color:rgba(255,255,255,.78);box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:none}
    .badge svg{width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .badge.top{left:50%;top:29px;transform:translateX(-50%) translateZ(70px);animation:floatTop 8s ease-in-out infinite}
    .badge.bottom{left:50%;bottom:22px;transform:translateX(-50%) translateZ(72px);background:#f5f5f5;color:#242424;animation:floatBottom 8.7s ease-in-out infinite}
    .badge.bottom svg{stroke:#444}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px rgba(82,199,138,.13),0 0 8px rgba(82,199,138,.35)}
    @keyframes floatTop{0%,100%{transform:translateX(-50%) translateY(0) translateZ(70px)}50%{transform:translateX(-50%) translateY(-2px) translateZ(70px)}}
    @keyframes floatBottom{0%,100%{transform:translateX(-50%) translateY(0) translateZ(72px)}50%{transform:translateX(-50%) translateY(2px) translateZ(72px)}}
    .app{position:absolute;left:50%;top:51%;width:300px;height:220px;transform:translate(-50%,-50%) translateZ(26px);border:1px solid rgba(255,255,255,.12);border-radius:14px;background:linear-gradient(145deg,#141414,#0e0e0e);box-shadow:0 24px 55px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.025);overflow:hidden}
    .app-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.065)}
    .traffic{display:flex;gap:5px}.traffic i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18)}
    .app-title{font-size:11px;color:rgba(255,255,255,.53);letter-spacing:.02em}.app-state{font-size:10px;color:rgba(255,255,255,.33)}
    .app-body{display:grid;grid-template-columns:72px 1fr;height:178px}
    .side{padding:14px 10px;border-right:1px solid rgba(255,255,255,.055);display:flex;flex-direction:column;gap:9px}
    .side-line{height:5px;border-radius:999px;background:rgba(255,255,255,.10)}.side-line:nth-child(1){width:82%}.side-line:nth-child(2){width:63%}.side-line:nth-child(3){width:76%}.side-line:nth-child(4){width:55%}.side-line.active{background:rgba(255,255,255,.74);box-shadow:0 0 7px rgba(255,255,255,.08)}
    .workspace{position:relative;padding:15px;overflow:hidden}.ws-top{display:flex;justify-content:space-between;align-items:center}.ws-title{font-size:12px;color:rgba(255,255,255,.76)}.ws-chip{font-size:9px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.05)}
    .module-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.module-card{height:54px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);padding:9px;transition:background .35s ease,border-color .35s ease,transform .35s cubic-bezier(.16,1,.3,1)}
    .module-card strong{display:block;font-size:10px;font-weight:500;color:rgba(255,255,255,.68);margin-bottom:7px}.mini-line{height:4px;border-radius:999px;background:rgba(255,255,255,.09);margin-top:5px}.mini-line.w1{width:82%}.mini-line.w2{width:58%}.module-card.active{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
    .module-card.active .mini-line:first-of-type{background:rgba(255,255,255,.76)}
        .module-pill{position:absolute;z-index:25;height:36px;display:flex;align-items:center;gap:8px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.075);background:rgba(10,10,10,.96);font-size:11px;color:rgba(255,255,255,.72);box-shadow:0 8px 20px rgba(0,0,0,.15);cursor:pointer;transform:translateZ(60px);transition:border-color .3s ease,background .3s ease,color .3s ease,box-shadow .3s ease}
    .module-pill:before{content:"";width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.28)}
    .module-pill:hover,.module-pill.active{background:rgba(18,18,18,.98);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.2)}
    .p1{left:38px;top:110px;animation:float1 7.8s ease-in-out infinite}.p2{right:33px;top:116px;animation:float2 8.5s ease-in-out infinite}.p3{left:42px;bottom:86px;animation:float3 9s ease-in-out infinite}.p4{right:38px;bottom:82px;animation:float4 8.2s ease-in-out infinite}
    @keyframes float1{0%,100%{translate:0 0}50%{translate:0 -2px}}@keyframes float2{0%,100%{translate:0 0}50%{translate:0 2px}}@keyframes float3{0%,100%{translate:0 0}50%{translate:0 2px}}@keyframes float4{0%,100%{translate:0 0}50%{translate:0 -2px}}
    @media(max-width:560px){.visual{height:360px}.app{width:270px;height:210px}.app-body{height:168px}.module-pill{font-size:10px;padding:0 10px}.p1{left:12px}.p2{right:10px}.p3{left:14px}.p4{right:12px}}
    @media(prefers-reduced-motion:reduce){.halo,.badge,.module-pill{animation:none!important}}
  

    /* Responsive mobile: controles alrededor del panel sin salirse */
    @media(max-width:520px){
      body{padding:10px}
      .visual{width:100%;height:400px;min-width:0}
      .halo{width:255px;height:255px}
      .badge{height:31px;padding:0 10px;font-size:10px;white-space:nowrap}
      .badge.top{top:17px}.badge.bottom{bottom:16px}
      .app{left:50%;top:50%;width:calc(100% - 24px);max-width:290px;height:200px;transform:translate(-50%,-50%) translateZ(26px)}
      .app-head{height:38px;padding:0 11px}.app-body{height:162px;grid-template-columns:60px 1fr}
      .side{padding:12px 8px;gap:8px}.workspace{padding:12px}
      .ws-title{font-size:11px}.ws-chip{font-size:8px;padding:3px 6px}
      .module-grid{gap:7px;margin-top:10px}.module-card{height:49px;padding:8px}.module-card strong{font-size:9px;margin-bottom:5px}.mini-line{height:3px;margin-top:4px}
      .module-pill{height:32px;font-size:9.5px;padding:0 9px}
      .module-pill:before{width:6px;height:6px}
      .p1{left:12px;top:70px}.p2{right:12px;top:70px}.p3{left:12px;bottom:70px}.p4{right:12px;bottom:70px}
    }
    @media(max-width:340px){
      body{padding:6px}
      .app{width:calc(100% - 14px)}
      .module-pill{font-size:9px;padding:0 8px}
      .p1,.p3{left:7px}.p2,.p4{right:7px}
      .badge.bottom{font-size:9.5px}
    }

  </style>
</head>
<body>
  <div class="visual" id="visual">
    <div class="dots"></div>
    <div class="stage" id="stage">
      <div class="halo"></div>
      <div class="badge top">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg>
        <span>Software adaptable</span>
      </div>
      <div class="app" id="app">
        <div class="app-head">
          <div class="traffic"><i></i><i></i><i></i></div>
          <div class="app-title">Panel de gestión</div>
          <div class="app-state">v1.4</div>
        </div>
        <div class="app-body">
          <div class="side">
            <div class="side-line active"></div><div class="side-line"></div><div class="side-line"></div><div class="side-line"></div>
          </div>
          <div class="workspace">
            <div class="ws-top"><span class="ws-title" id="wsTitle">Resumen</span><span class="ws-chip" id="wsChip">Activo</span></div>
            <div class="module-grid">
              <div class="module-card active" data-card="Clientes"><strong>Clientes</strong><div class="mini-line w1"></div><div class="mini-line w2"></div></div>
              <div class="module-card" data-card="Stock"><strong>Stock</strong><div class="mini-line w2"></div><div class="mini-line w1"></div></div>
              <div class="module-card" data-card="Presupuestos"><strong>Presupuestos</strong><div class="mini-line w1"></div><div class="mini-line w2"></div></div>
              <div class="module-card" data-card="Equipo"><strong>Equipo</strong><div class="mini-line w2"></div><div class="mini-line w1"></div></div>
            </div>
            
          </div>
        </div>
      </div>
      <button class="module-pill p1 active" type="button" data-module="Clientes">Clientes</button>
      <button class="module-pill p2" type="button" data-module="Stock">Stock</button>
      <button class="module-pill p3" type="button" data-module="Presupuestos">Presupuestos</button>
      <button class="module-pill p4" type="button" data-module="Equipo">Equipo</button>
      <div class="badge bottom"><span class="status-dot"></span><span id="bottomText">4 módulos · una sola herramienta</span></div>
    </div>
  </div>
  <script>
    const root=document.getElementById('visual');
    const stage=document.getElementById('stage');
    const pills=[...root.querySelectorAll('.module-pill')];
    const cards=[...root.querySelectorAll('.module-card')];
    const wsTitle=document.getElementById('wsTitle');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let rx=0,ry=0,trx=0,tryy=0,index=0,cycleTimer=null;
    const names=['Clientes','Stock','Presupuestos','Equipo'];
    function activate(name){
      pills.forEach(p=>p.classList.toggle('active',p.dataset.module===name));
      cards.forEach(c=>c.classList.toggle('active',c.dataset.card===name));
      wsTitle.textContent=name;
    }
    pills.forEach((p,i)=>{p.addEventListener('pointerenter',()=>{index=i;activate(p.dataset.module)});p.addEventListener('pointerdown',()=>{index=i;activate(p.dataset.module)})});
    setInterval(()=>{if(document.hidden)return;index=(index+1)%names.length;activate(names[index])},2600);
    root.addEventListener('pointermove',e=>{if(reduced)return;const r=root.getBoundingClientRect();const x=((e.clientX-r.left)/r.width-.5)*2;const y=((e.clientY-r.top)/r.height-.5)*2;tryy=x*3.2;trx=-y*2.5});
    root.addEventListener('pointerleave',()=>{trx=0;tryy=0});
    function frame(){rx+=(trx-rx)*.055;ry+=(tryy-ry)*.055;stage.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(frame)}
    activate('Clientes');frame();
  </script>
</body>
</html>
