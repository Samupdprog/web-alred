<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboards y control</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#1c1c1c;--panel:#101010;--border:rgba(255,255,255,.09);--text:#f5f5f5;--muted:rgba(255,255,255,.42);--green:#51c98a}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0e0e0e;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .visual{position:relative;width:min(650px,100%);height:380px;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.03),transparent 48%),var(--bg);perspective:1000px;isolation:isolate}
    .dots{position:absolute;inset:0;opacity:.17;background-image:radial-gradient(circle,rgba(255,255,255,.15) .8px,transparent 1px);background-size:18px 18px;mask-image:radial-gradient(ellipse at center,#000,rgba(0,0,0,.75) 49%,transparent 87%);pointer-events:none}.stage{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
    .dash{position:absolute;left:50%;top:50%;width:430px;height:245px;transform:translate(-50%,-50%) translateZ(25px);border-radius:14px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,#141414,#0f0f0f);box-shadow:0 24px 55px rgba(0,0,0,.29),inset 0 1px 0 rgba(255,255,255,.025);overflow:hidden}
    .head{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.06)}.head-title{font-size:11px;color:rgba(255,255,255,.61)}.live{display:flex;align-items:center;gap:6px;font-size:9px;color:rgba(255,255,255,.4)}.live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px rgba(81,201,138,.35)}
    .content{display:grid;grid-template-columns:1fr 124px;gap:12px;padding:13px;height:202px}.chart{position:relative;border-radius:10px;border:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.018);overflow:hidden;padding:12px 11px 8px;cursor:pointer;transition:border-color .28s ease,background .28s ease,box-shadow .28s ease}.chart:hover{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.028);box-shadow:0 0 0 1px rgba(255,255,255,.02),0 10px 22px rgba(0,0,0,.12)}.chart-title{font-size:10px;color:rgba(255,255,255,.48)}.chart-value{font-size:19px;letter-spacing:-.04em;margin-top:3px}.chart-sub{font-size:8px;color:rgba(255,255,255,.26);margin-left:5px}.chart-svg{position:absolute;left:9px;right:9px;bottom:11px;width:calc(100% - 18px);height:112px;overflow:visible}.gridline{stroke:rgba(255,255,255,.045);stroke-width:1;transition:stroke .28s ease}.chart:hover .gridline{stroke:rgba(255,255,255,.075)}.area{fill:url(#areaFill);opacity:.6;transition:opacity .28s ease}.chart:hover .area{opacity:.82}.line{fill:none;stroke:rgba(255,255,255,.92);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,255,255,.15));transition:stroke .28s ease,filter .28s ease,opacity .28s ease}.chart:hover .line{stroke:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.22))}
    .side{display:grid;grid-template-rows:repeat(3,1fr);gap:8px}.kpi{border-radius:10px;border:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.018);padding:10px;transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s ease}.kpi:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.13)}.k-label{font-size:8px;color:rgba(255,255,255,.3)}.k-value{font-size:15px;margin-top:3px;letter-spacing:-.03em}.k-bar{height:4px;border-radius:999px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}.k-fill{height:100%;width:0;border-radius:inherit;background:rgba(255,255,255,.68);transition:width 1.2s cubic-bezier(.16,1,.3,1)}
    .floating{position:absolute;z-index:20;height:35px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.075);background:rgba(10,10,10,.96);display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.72);box-shadow:0 8px 22px rgba(0,0,0,.14);pointer-events:none}.f1{left:57px;top:34px;transform:translateZ(68px);animation:f1 8s ease-in-out infinite}.f2{right:56px;top:42px;transform:translateZ(68px);animation:f2 8.6s ease-in-out infinite}.f3{left:50%;bottom:24px;transform:translateX(-50%) translateZ(70px);background:#f5f5f5;color:#242424;animation:f3 8.3s ease-in-out infinite}.floating .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    @keyframes f1{0%,100%{transform:translateY(0) translateZ(68px)}50%{transform:translateY(-2px) translateZ(68px)}}@keyframes f2{0%,100%{transform:translateY(0) translateZ(68px)}50%{transform:translateY(2px) translateZ(68px)}}@keyframes f3{0%,100%{transform:translateX(-50%) translateY(0) translateZ(70px)}50%{transform:translateX(-50%) translateY(-2px) translateZ(70px)}}
    @media(max-width:560px){.dash{width:395px;transform:translate(-50%,-50%) translateZ(25px) scale(.9)}.f1{left:18px}.f2{right:18px}}
    @media(max-width:450px){.dash{transform:translate(-50%,-50%) translateZ(25px) scale(.78)}.floating{font-size:10px}}
    @media(prefers-reduced-motion:reduce){.floating{animation:none!important}}
  </style>
</head>
<body>
  <div class="visual" id="visual"><div class="dots"></div><div class="stage" id="stage">
    <div class="floating f1"><span class="dot"></span><span>Datos en tiempo real</span></div><div class="floating f2"><span>Últimos 30 días</span></div>
    <div class="dash">
      <div class="head"><span class="head-title">Panel de control</span><span class="live"><i></i>Actualizado ahora</span></div>
      <div class="content">
        <div class="chart" id="chart"><div class="chart-title">Actividad</div><div><span class="chart-value" id="mainValue">1.284</span><span class="chart-sub">eventos</span></div>
          <svg class="chart-svg" viewBox="0 0 270 112" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="white" stop-opacity=".14"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient></defs>
            <path class="gridline" d="M0 25H270M0 55H270M0 85H270"/>
            <path class="area" id="area" d="M0 88 C30 80 44 91 68 67 S105 44 126 61 S167 88 192 52 S232 28 270 35 L270 112 L0 112Z"/>
            <path class="line" id="line" d="M0 88 C30 80 44 91 68 67 S105 44 126 61 S167 88 192 52 S232 28 270 35"/>
          </svg>
          
        </div>
        <div class="side">
          <div class="kpi"><div class="k-label">Completadas</div><div class="k-value">86%</div><div class="k-bar"><div class="k-fill" data-w="86"></div></div></div>
          <div class="kpi"><div class="k-label">Pendientes</div><div class="k-value">18</div><div class="k-bar"><div class="k-fill" data-w="34"></div></div></div>
          <div class="kpi"><div class="k-label">Tiempo medio</div><div class="k-value">2,4m</div><div class="k-bar"><div class="k-fill" data-w="67"></div></div></div>
        </div>
      </div>
    </div>
    <div class="floating f3"><span>Todo bajo control</span></div>
  </div></div>
  <script>
    const root=document.getElementById('visual'),stage=document.getElementById('stage'),chart=document.getElementById('chart'),line=document.getElementById('line'),fills=[...root.querySelectorAll('.k-fill')];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let rx=0,ry=0,trx=0,tryy=0;
    const length=line.getTotalLength();line.style.strokeDasharray=length;line.style.strokeDashoffset=length;requestAnimationFrame(()=>{line.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:1600,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});fills.forEach((f,i)=>setTimeout(()=>f.style.width=f.dataset.w+'%',350+i*140))});
    
    root.addEventListener('pointermove',e=>{if(reduced)return;const r=root.getBoundingClientRect();const x=((e.clientX-r.left)/r.width-.5)*2,y=((e.clientY-r.top)/r.height-.5)*2;tryy=x*3.1;trx=-y*2.45});root.addEventListener('pointerleave',()=>{trx=0;tryy=0});function frame(){rx+=(trx-rx)*.055;ry+=(tryy-ry)*.055;stage.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(frame)}frame();
  </script>
</body>
</html>
